name: ci-typescript

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ts-format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check TypeScript formatting
        run: pnpm format:check:ts

  ts-lint-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check TypeScript linting
        run: pnpm lint:check:ts

  ts-build-test:
    runs-on: ubuntu-latest
    needs: [ts-format-check, ts-lint-check]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build TypeScript packages
        run: pnpm build

      - name: Edge runtime smoke test (arcade-ts)
        run: pnpm --filter @cartridge/arcade test:edge:smoke

      - name: Test TypeScript packages
        run: pnpm test:ts

      - name: Test packed Arcade consumers
        run: pnpm --filter @cartridge/arcade test:pack

      - name: Test Arcade release version guard
        run: |
          node .github/scripts/assert-release-version.mjs 0.4.0
          node .github/scripts/assert-release-version.mjs 0.4.0-preview.0
          node .github/scripts/assert-release-version.mjs 1.0.0
          ! node .github/scripts/assert-release-version.mjs 0.3.99
          ! node .github/scripts/assert-release-version.mjs v0.4.0
