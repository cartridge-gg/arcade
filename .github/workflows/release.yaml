name: Release

on:
  repository_dispatch:
    types: [release]

env:
  WORKING_DIRECTORY: ./packages/arcade-ts

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org/"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Validate release version
        run: node .github/scripts/assert-release-version.mjs "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ github.event.client_payload.version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build NPM Package
        run: pnpm --filter @cartridge/arcade build

      - name: Test packed Arcade consumers
        run: pnpm --filter @cartridge/arcade test:pack

      - name: Prepare NPM Package
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: pnpm pkg set "version=$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ github.event.client_payload.version }}

      - name: Publish to NPM
        if: ${{ !github.event.client_payload.dry_run }}
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: pnpm publish --no-git-checks --access public --tag "$RELEASE_TAG"
        env:
          NPM_CONFIG_PROVENANCE: "true"
          RELEASE_TAG: ${{ github.event.client_payload.tag }}

      - name: Create GitHub Release
        if: ${{ !github.event.client_payload.dry_run }}
        uses: softprops/action-gh-release@v1
        with:
          name: v${{ github.event.client_payload.version }}
          tag_name: v${{ github.event.client_payload.version }}
          prerelease: ${{ github.event.client_payload.tag == 'prerelease' }}
          files: |
            arcade/pkg/*.wasm
            arcade/pkg/*.js
            arcade/pkg/*.d.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
